
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result Analyzer | Intech</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fffdf7;
  --panel:#ffffff;
  --paper:#f5f2e9;
  --ink:#17233f;
  --muted:#697590;
  --line:#dce2ef;
  --blue:#315bea;
  --blue-dark:#203dba;
  --pink:#ef668f;
  --purple:#756cf0;
  --lime:#b9e84a;
  --orange:#ff9c55;
  --grey:#8995ad;
  --shadow:0 18px 45px rgba(28,49,98,.09);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 7% 8%,rgba(185,232,74,.18),transparent 250px),
    radial-gradient(circle at 94% 12%,rgba(117,108,240,.14),transparent 280px),
    var(--bg);
  font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(23,35,63,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,35,63,.035) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(#000,transparent 80%);
}

button,input{font:inherit}

button{cursor:pointer}

.wrap{
  width:min(1160px,calc(100% - 34px));
  margin:auto;
  padding:30px 0 80px;
}

.brand-header{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:12px;
}

.brand{
  color:var(--blue);
  font-size:25px;
  font-style:italic;
  font-weight:800;
  letter-spacing:-.08em;
}

.brand-header small{
  color:var(--muted);
  font-size:11px;
}

h1{
  max-width:750px;
  margin:0 0 12px;
  color:var(--blue);
  font-size:clamp(40px,7vw,78px);
  line-height:.95;
  letter-spacing:-.075em;
}

.sub{
  max-width:650px;
  margin:0 0 30px;
  color:var(--muted);
  font-size:18px;
}

.setup{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:18px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:25px;
  background:rgba(255,255,255,.88);
  box-shadow:var(--shadow);
}

.drop{
  min-height:175px;
  display:grid;
  place-content:center;
  gap:7px;
  padding:25px;
  border:2px dashed #aeb9d4;
  border-radius:19px;
  background:
    radial-gradient(circle at 15% 15%,rgba(185,232,74,.2),transparent 130px),
    var(--paper);
  text-align:center;
  cursor:pointer;
  transition:.2s ease;
}

.drop:hover,.drop.on{
  border-color:var(--blue);
  background:#f0f4ff;
  transform:translateY(-2px);
}

.drop input{display:none}

.upload-icon{
  width:47px;
  height:47px;
  display:grid;
  place-items:center;
  margin:auto;
  border-radius:14px;
  background:var(--blue);
  color:white;
  font-size:25px;
}

.drop strong{font-size:18px}
.drop span{color:var(--muted);font-size:14px}

.ask{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:11px;
}

.ask label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

input[type=text]{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:0;
  background:white;
  color:var(--ink);
}

input[type=text]:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(49,91,234,.12);
}

button{
  padding:14px 20px;
  border:0;
  border-radius:13px;
  background:var(--blue);
  color:white;
  font-weight:700;
  transition:.2s ease;
}

button:hover{
  background:var(--blue-dark);
  transform:translateY(-2px);
}

.msg{
  min-height:25px;
  margin:17px 3px 0;
  color:#d54666;
  font-weight:600;
}

.hl{
  max-width:800px;
  margin:65px 0 12px;
  font-size:clamp(30px,5vw,55px);
  line-height:1;
  letter-spacing:-.06em;
}

.lede{
  margin:0 0 30px;
  color:var(--muted);
  font-size:18px;
}

.band{
  display:grid;
  grid-template-columns:minmax(0,270px) 1fr;
  gap:30px;
  padding:38px 0;
  border-top:1px solid var(--line);
}

.band h2,.sec h2{
  margin:0 0 3px;
  color:var(--muted);
  font-size:16px;
}

.big{
  margin:0 0 13px;
  font-size:65px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.07em;
}

.facts{
  margin:0;
  padding-left:18px;
  color:var(--muted);
}

.facts b{color:var(--ink)}

.chart svg,.map svg{
  width:100%;
  height:auto;
  display:block;
}

.sec{
  padding:32px 0;
  border-top:1px solid var(--line);
}

.sec p.n{
  max-width:680px;
  margin:5px 0 17px;
  color:var(--muted);
}

.map{
  padding:18px;
  border:1px solid var(--line);
  border-radius:23px;
  background:#f0f3ff;
  box-shadow:var(--shadow);
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}

.key{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin:13px 2px 0;
  color:var(--muted);
  font-size:14px;
}

.key i{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:6px;
  border-radius:50%;
}

ol.lad{
  margin:8px 0 0;
  padding:0;
  list-style:none;
}

ol.lad li{
  display:grid;
  grid-template-columns:30px 1fr 75px 48px;
  gap:8px;
  align-items:center;
  padding:8px;
  border-radius:10px;
  font-size:15px;
}

ol.lad li.me{
  background:white;
  outline:2px solid var(--pink);
  font-weight:700;
  box-shadow:var(--shadow);
}

.rk{color:var(--muted)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl{text-align:right;font-variant-numeric:tabular-nums}

.bar{
  height:7px;
  overflow:hidden;
  border-radius:5px;
  background:var(--line);
}

.bar i{
  display:block;
  height:100%;
  background:var(--grey);
}

.me .bar i{background:var(--pink)}

details{margin-top:12px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:700}
details ul{max-height:280px;overflow:auto;margin:8px 0;padding:0;list-style:none}
details li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 2px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.subject-group-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin:27px 0 9px;
  color:var(--blue);
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.subject-group-title:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--line);
}

.subject-item{
  margin:10px 0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.85);
  transition:.2s ease;
}

.subject-item:hover{
  border-color:#aebbe8;
  box-shadow:0 8px 25px rgba(28,49,98,.07);
}

.subject-item summary{
  display:grid;
  grid-template-columns:minmax(170px,1fr) minmax(190px,1.5fr) auto 20px;
  gap:16px;
  align-items:center;
  list-style:none;
}

.subject-item summary::-webkit-details-marker{display:none}
.subject-item summary:after{content:"+";color:var(--blue);font-size:22px}
.subject-item[open] summary:after{content:"−"}

.subject-name{font-weight:700}

.subject-kind{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:400;
}

.subject-grade{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--lime);
  color:var(--ink);
  font-weight:800;
}

.subject-bar{
  display:flex;
  height:9px;
  overflow:hidden;
  border-radius:8px;
  background:var(--line);
}

.subject-bar .higher{background:var(--orange)}
.subject-bar .lower{background:var(--lime)}

.subject-counts{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.subject-counts b{color:var(--ink)}

.subject-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
  padding-top:15px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.subject-detail b{color:var(--ink)}

svg text{
  fill:var(--muted);
  font-family:inherit;
  font-size:10px;
}

svg .you{
  fill:var(--pink);
  font-size:11px;
  font-weight:800;
}

.bar-r{
  fill:var(--grey);
  opacity:.62;
  transform-box:fill-box;
  transform-origin:bottom;
  animation:grow .7s both;
}

.bar-r.me{
  fill:var(--pink);
  opacity:1;
}

.quad{
  fill:var(--purple);
  opacity:.15;
}

@keyframes grow{from{transform:scaleY(0)}}

@media(max-width:760px){
  .setup,.band,.two{grid-template-columns:1fr}
  .subject-item summary{
    grid-template-columns:1fr auto 20px;
  }
  .subject-compare{
    grid-column:1/-1;
    grid-row:2;
  }
  .subject-detail{grid-template-columns:1fr}
}

@media(max-width:520px){
  .wrap{width:calc(100% - 22px)}
  .band{gap:15px}
  .big{font-size:55px}
  .privacy{display:none}
}
</style>
</head>

<body>
<main class="wrap">

<header class="brand-header">
  <div class="brand">INTECH</div>
  <small>Made by Intech</small>
</header>

<h1>Understand your results better.</h1>

<p class="sub">
  Upload your class result sheet and compare your SPI, CPI,
  subjects, and class position privately in your browser.
</p>

<section class="setup">
  <label class="drop" id="drop" tabindex="0">
    <input id="file" type="file" accept=".xlsx,.xls,.csv">
    <span class="upload-icon">↑</span>
    <strong id="dropT">Choose the Excel sheet</strong>
    <span id="dropS">or drag it onto this box</span>
  </label>

  <div class="ask">
    <label for="roll">Your roll number</label>
    <input id="roll" type="text" inputmode="numeric" placeholder="Enter your roll number">
    <button id="go">Analyze results</button>
  </div>
</section>

<p class="msg" id="msg" role="alert"></p>
<div id="out"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;"
}[c]));

const norm=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");

let rows=[];
let subjects=[];
let currentStudent=null;

function say(text){
  $("#msg").textContent=text;
}

function loaded(list,label,subs){
  rows=list;
  subjects=subs||[];
  $("#dropT").textContent=label;
  $("#dropS").textContent=`${list.length} students loaded`;
  say("");
}

function readFile(file){
  const reader=new FileReader();

  reader.onerror=()=>{
    say("Could not read that file. Please try another Excel file.");
  };

  reader.onload=e=>{
    try{
      const workbook=XLSX.read(e.target.result,{type:"array"});
      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(sheet,{defval:""});

      if(!data.length)throw Error("empty");

      const keys=Object.keys(data[0]);
      const find=key=>keys.find(k=>norm(k)===key);

      const nameKey=find("name");
      const rollKey=find("rollno");
      const spiKey=find("spi");
      const cpiKey=find("cpi");

      if(!rollKey||!spiKey||!cpiKey)throw Error("columns");

      subjects=keys.filter(k=>![nameKey,rollKey,spiKey,cpiKey].includes(k));

      const list=data.map(row=>({
        name:String(nameKey?row[nameKey]:"").trim(),
        roll:String(row[rollKey]).trim(),
        spi:parseFloat(row[spiKey]),
        cpi:parseFloat(row[cpiKey]),
        grades:Object.fromEntries(
          subjects.map(s=>[s,String(row[s]??"").trim().toUpperCase()])
        )
      })).filter(x=>x.roll&&!isNaN(x.spi)&&!isNaN(x.cpi));

      if(!list.length)throw Error("students");

      loaded(list,file.name,subjects);
    }catch(error){
      const messages={
        empty:"That spreadsheet is empty.",
        columns:"Could not find Roll No, SPI and CPI columns.",
        students:"No valid students were found in the sheet."
      };

      say(messages[error.message]||"That file could not be processed.");
    }
  };

  reader.readAsArrayBuffer(file);
}

function stat(key,me){
  const higher=rows.filter(r=>r[key]>me[key]);
  const lower=rows.filter(r=>r[key]<me[key]);

  return{
    key,
    value:me[key],
    higher,
    lower,
    same:rows.filter(r=>r!==me&&r[key]===me[key]).length,
    rank:higher.length+1,
    average:rows.reduce((sum,r)=>sum+r[key],0)/rows.length,
    highest:Math.max(...rows.map(r=>r[key]))
  };
}

function hist(key,me){
  const values=rows.map(r=>r[key]);
  const low=Math.floor(Math.min(...values)*2)/2;
  const high=Math.max(Math.ceil(Math.max(...values)*2)/2,low+.5);
  const count=Math.round((high-low)/.5);
  const bins=Array(count).fill(0);

  values.forEach(v=>{
    bins[Math.min(count-1,Math.floor((v-low)/.5))]++;
  });

  const max=Math.max(...bins);
  const W=460,H=220,pad=25,bw=W/count;
  const selected=Math.min(count-1,Math.floor((me[key]-low)/.5));

  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;

  bins.forEach((amount,i)=>{
    const height=(H-55)*amount/max;
    const x=i*bw+4;
    const y=H-30-height;
    const middle=x+(bw-8)/2;

    svg+=`
      <rect class="bar-r${i===selected?" me":""}"
        x="${x}" y="${y}" width="${bw-8}" height="${height}" rx="5">
      </rect>
      <text x="${middle}" y="${y-6}" text-anchor="middle">${amount}</text>
      <text x="${middle}" y="${H-10}" text-anchor="middle">
        ${(low+i*.5).toFixed(1)}
      </text>
    `;

    if(i===selected){
      svg+=`<text class="you" x="${middle}" y="${Math.max(14,y-22)}" text-anchor="middle">You</text>`;
    }
  });

  return svg+"</svg>";
}

function scatter(me){
  const W=600,H=380,p={l:50,r:18,t:25,b:42};
  const xs=rows.map(r=>r.spi);
  const ys=rows.map(r=>r.cpi);
  const minX=Math.min(...xs)-.2;
  const maxX=Math.max(...xs)+.2;
  const minY=Math.min(...ys)-.2;
  const maxY=Math.max(...ys)+.2;

  const X=v=>p.l+(v-minX)/(maxX-minX)*(W-p.l-p.r);
  const Y=v=>H-p.b-(v-minY)/(maxY-minY)*(H-p.t-p.b);

  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;

  svg+=`
    <rect class="quad"
      x="${X(me.spi)}"
      y="${p.t}"
      width="${W-p.r-X(me.spi)}"
      height="${Y(me.cpi)-p.t}">
    </rect>

    <line x1="${X(me.spi)}" x2="${X(me.spi)}"
      y1="${p.t}" y2="${H-p.b}"
      stroke="var(--pink)" stroke-dasharray="6 6">

    </line>

    <line x1="${p.l}" x2="${W-p.r}"
      y1="${Y(me.cpi)}" y2="${Y(me.cpi)}"
      stroke="var(--pink)" stroke-dasharray="6 6">
    </line>

    <text x="${W/2}" y="${H-7}" text-anchor="middle">SPI</text>
    <text x="18" y="16">CPI</text>
  `;

  rows.forEach(r=>{
    if(r===me)return;

    const ahead=r.spi>me.spi&&r.cpi>me.cpi;

    svg+=`
      <circle cx="${X(r.spi)}" cy="${Y(r.cpi)}"
        r="${ahead?5:3.8}"
        fill="${ahead?"var(--purple)":"var(--grey)"}"
        opacity="${ahead?.9:.58}">
        <title>${esc(r.name||r.roll)} — SPI ${r.spi.toFixed(2)}, CPI ${r.cpi.toFixed(2)}</title>
      </circle>
    `;
  });

  svg+=`
    <circle cx="${X(me.spi)}" cy="${Y(me.cpi)}"
      r="9" fill="var(--pink)" stroke="var(--bg)" stroke-width="3">
    </circle>
    <text class="you" x="${X(me.spi)+12}" y="${Y(me.cpi)-12}">You</text>
  `;

  return svg+"</svg>";
}

function ladder(key,me){
  const sorted=[...rows].sort((a,b)=>b[key]-a[key]);
  const index=sorted.indexOf(me);

  return sorted.slice(Math.max(0,index-3),index+4).map(row=>`
    <li class="${row===me?"me":""}">
      <span class="rk">${sorted.indexOf(row)+1}</span>
      <span class="nm">${esc(row.name||row.roll)}${row===me?" (you)":""}</span>
      <span class="bar"><i style="width:${Math.min(100,row[key]*10)}%"></i></span>
      <span class="vl">${row[key].toFixed(2)}</span>
    </li>
  `).join("");
}

function ahead(statistic){
  if(!statistic.higher.length){
    return `<details><summary>Nobody is ahead of you</summary></details>`;
  }

  return`
    <details>
      <summary>Everyone ahead of you (${statistic.higher.length})</summary>
      <ul>
        ${statistic.higher.map(row=>`
          <li>
            <span>${esc(row.name||row.roll)}</span>
            <span>${row[statistic.key].toFixed(2)}</span>
          </li>
        `).join("")}
      </ul>
    </details>
  `;
}

const ORDER=["F","D","C","B","B+","A","A+","O"];

function gradeValue(grade){
  const index=ORDER.indexOf(String(grade||"").trim().toUpperCase());
  return index<0?null:index;
}

function subjectStats(me){
  return subjects.map(key=>{
    const mine=gradeValue(me.grades[key]);

    if(mine===null)return null;

    const valid=rows
      .map(row=>gradeValue(row.grades[key]))
      .filter(value=>value!==null);

    const better=valid.filter(value=>value>mine).length;
    const lower=valid.filter(value=>value<mine).length;

    return{
      name:String(key).replace(/\s*\([^)]*\)\s*$/,""),
      grade:me.grades[key],
      better,
      lower
    };
  }).filter(Boolean);
}

function subjectsSection(me){
  const all=subjectStats(me);
  const theory=all.filter(s=>!/lab/i.test(s.name));
  const labs=all.filter(s=>/lab/i.test(s.name));

  const group=(title,list)=>{
    if(!list.length)return"";

    return`
      <div class="subject-group-title">${title}</div>
      ${list.map(s=>{
        const total=s.better+s.lower;
        const high=total?s.better/total*100:0;
        const low=total?s.lower/total*100:0;

        return`
          <details class="subject-item">
            <summary>
              <div class="subject-name">
                ${esc(s.name)}
                <span class="subject-kind">
                  ${/lab/i.test(s.name)?"Laboratory":"Theory"}
                </span>
              </div>

              <div>
                <div class="subject-bar">
                  <i class="higher" style="width:${high}%"></i>
                  <i class="lower" style="width:${low}%"></i>
                </div>

                <div class="subject-counts">
                  <span><b>${s.better}</b> higher</span>
                  <span><b>${s.lower}</b> lower</span>
                </div>
              </div>

              <span class="subject-grade">${esc(s.grade)}</span>
            </summary>

            <div class="subject-detail">
              <div><b>${s.better}</b> students scored higher than you.</div>
              <div><b>${s.lower}</b> students scored lower than you.</div>
            </div>
          </details>
        `;
      }).join("")}
    `;
  };

  return`
    <section class="sec">
      <h2>Subject by subject</h2>
      <p class="n">
        Students with the same, missing, or F grade are excluded
        from the higher and lower counts.
      </p>
      ${group("Theory",theory)}
      ${group("Labs",labs)}
    </section>
  `;
}

function band(statistic){
  return`
    <section class="band">
      <div>
        <h2>Your ${statistic.key.toUpperCase()}</h2>
        <p class="big">${statistic.value.toFixed(2)}</p>
        <ul class="facts">
          <li>Rank <b>${statistic.rank}</b> of ${rows.length}</li>
          <li>Ahead of <b>${statistic.lower}</b> students</li>
          <li>Class average <b>${statistic.average.toFixed(2)}</b></li>
          <li>Highest score <b>${statistic.highest.toFixed(2)}</b></li>
        </ul>
      </div>

      <div class="chart">${hist(statistic.key,currentStudent)}</div>
    </section>
  `;
}

function run(){
  if(!rows.length){
    say("Choose the Excel sheet first.");
    return;
  }

  const roll=$("#roll").value.trim();

  if(!roll){
    say("Enter your roll number.");
    return;
  }

  currentStudent=rows.find(row=>row.roll===roll);

  if(!currentStudent){
    say("That roll number was not found in the sheet.");
    return;
  }

  const spi=stat("spi",currentStudent);
  const cpi=stat("cpi",currentStudent);

  const studentsAheadOnBoth=rows.filter(row =>
    row.spi > currentStudent.spi &&
    row.cpi > currentStudent.cpi
  ).length;

  /*
    Important:
    Use .length here.
    Do not print spi.higher directly,
    because spi.higher is an array of student objects.
  */
  const higherCountText = (statistic, label) => {
    const count=statistic.higher.length;

    return `
      ${count}
      ${count===1 ? "student has" : "students have"}
      a higher ${label} than you.
    `;
  };

  say("");

  $("#out").innerHTML=`
    <h2 class="hl">
      ${higherCountText(spi,"SPI")}
      ${higherCountText(cpi,"CPI")}
    </h2>

    <p class="lede">
      ${esc(currentStudent.name || "Student")},
      roll number ${esc(currentStudent.roll)}.
    </p>

    ${band(spi)}
    ${band(cpi)}

    <section class="sec">
      <h2>SPI against CPI</h2>

      <p class="n">
        Each dot is a student. The dashed lines cross at you,
        and the shaded corner shows students ahead on both.
      </p>

      <div class="map">
        ${scatter(currentStudent)}
      </div>

      <div class="key">
        <span>
          <i style="background:var(--me)"></i>
          You
        </span>

        <span>
          <i style="background:var(--ahead)"></i>
          Ahead on both (${studentsAheadOnBoth})
        </span>

        <span>
          <i style="background:var(--cls)"></i>
          Everyone else
        </span>
      </div>
    </section>

    <section class="sec two">
      <div>
        <h2>Around you in SPI</h2>
        <ol class="lad">
          ${ladder("spi",currentStudent)}
        </ol>
        ${ahead(spi)}
      </div>

      <div>
        <h2>Around you in CPI</h2>
        <ol class="lad">
          ${ladder("cpi",currentStudent)}
        </ol>
        ${ahead(cpi)}
      </div>
    </section>

    ${subjectSection(currentStudent)}
  `;

  $("#out").scrollIntoView({
    behavior:matchMedia("(prefers-reduced-motion: reduce)").matches
      ? "auto"
      : "smooth"
  });
}
const drop=$("#drop");

$("#file").addEventListener("change",event=>{
  if(event.target.files[0])readFile(event.target.files[0]);
});

drop.addEventListener("dragover",event=>{
  event.preventDefault();
  drop.classList.add("on");
});

drop.addEventListener("dragleave",()=>{
  drop.classList.remove("on");
});

drop.addEventListener("drop",event=>{
  event.preventDefault();
  drop.classList.remove("on");

  if(event.dataTransfer.files[0]){
    readFile(event.dataTransfer.files[0]);
  }
});

drop.addEventListener("keydown",event=>{
  if(event.key==="Enter"||event.key===" "){
    event.preventDefault();
    $("#file").click();
  }
});

$("#go").addEventListener("click",run);

$("#roll").addEventListener("keydown",event=>{
  if(event.key==="Enter")run();
});
</script>

</body>
</html>
