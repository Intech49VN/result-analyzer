
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Result Analyzer — Intech</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #fffdf7;
      --paper-2: #f7f4ea;
      --ink: #17233f;
      --muted: #6d7892;
      --line: #dce1ec;
      --blue: #315bea;
      --blue-dark: #203dba;
      --lime: #b8e83e;
      --orange: #ff9d55;
      --pink: #f36c9c;
      --purple: #9486ee;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(28, 49, 98, .09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(184,232,62,.22), transparent 20rem),
        radial-gradient(circle at 92% 17%, rgba(148,134,238,.16), transparent 22rem),
        var(--paper);
      font: 16px/1.55 "Bricolage Grotesque", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background-image:
        linear-gradient(rgba(23,35,63,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,35,63,.025) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, #000, transparent 80%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1180px, calc(100% - 34px));
      margin: auto;
      padding: 28px 0 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 60px;
    }

    .brand {
      color: var(--blue-dark);
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -.06em;
    }

    .brand small {
      display: block;
      margin-top: -5px;
      color: var(--muted);
      font-size: 10px;
      font-style: normal;
      font-weight: 500;
      letter-spacing: .04em;
    }

    .privacy {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr .8fr;
      gap: 60px;
      align-items: end;
      margin-bottom: 40px;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      line-height: .94;
      letter-spacing: -.075em;
    }

    .highlight {
      color: var(--blue);
    }

    .hero p {
      max-width: 590px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .setup {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 18px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,.8);
      box-shadow: var(--shadow);
    }

    .drop {
      min-height: 190px;
      display: grid;
      place-content: center;
      gap: 7px;
      padding: 25px;
      border: 2px dashed #aeb9d4;
      border-radius: 20px;
      background:
        radial-gradient(circle at 15% 15%, rgba(184,232,62,.22), transparent 8rem),
        var(--paper-2);
      text-align: center;
      transition: .2s ease;
    }

    .drop:hover,
    .drop.active {
      border-color: var(--blue);
      transform: translateY(-2px);
      background-color: #f0f4ff;
    }

    .drop input {
      display: none;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 5px;
      border-radius: 15px;
      background: var(--blue);
      color: white;
      font-size: 25px;
    }

    .drop strong {
      font-size: 19px;
    }

    .drop span {
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .controls label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: 0;
      background: white;
      color: var(--ink);
    }

    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(49,91,234,.12);
    }

    .primary {
      padding: 14px 20px;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      transition: .2s ease;
    }

    .primary:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
    }

    .message {
      min-height: 25px;
      margin: 18px 3px 0;
      color: #d54666;
      font-weight: 600;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 9px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #c9d3f5;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-card {
      display: grid;
      place-items: center;
      gap: 8px;
      margin-top: 35px;
      padding: 45px 20px;
      border: 1px solid #ffd4df;
      border-radius: 24px;
      background: #fff3f6;
      text-align: center;
    }

    .error-card .emoji {
      font-size: 42px;
    }

    .results {
      margin-top: 70px;
    }

    .intro {
      margin-bottom: 30px;
    }

    .intro h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -.055em;
    }

    .intro p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .metric {
      position: relative;
      overflow: hidden;
      padding: 24px;
      border-radius: 24px;
      background: var(--ink);
      color: white;
    }

    .metric:nth-child(2) {
      background: var(--blue);
    }

    .metric::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -45px;
      bottom: -65px;
      border: 22px solid rgba(255,255,255,.13);
      border-radius: 50%;
    }

    .metric-title {
      color: rgba(255,255,255,.72);
      font-size: 14px;
      font-weight: 600;
    }

    .metric-value {
      margin: 8px 0 18px;
      font-size: 58px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.07em;
    }

    .metric-info {
      color: rgba(255,255,255,.78);
      font-size: 14px;
    }

    .metric-info b {
      color: white;
    }

    .section {
      margin-top: 55px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.04em;
    }

    .section-heading p {
      max-width: 510px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .subject-group {
      margin-top: 26px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .group-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .subject {
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.85);
      overflow: hidden;
      transition: .2s ease;
    }

    .subject:hover {
      border-color: #b9c6ed;
      box-shadow: 0 8px 25px rgba(28,49,98,.06);
    }

    .subject summary {
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(180px, 1.2fr) auto 22px;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
      cursor: pointer;
      list-style: none;
    }

    .subject summary::-webkit-details-marker {
      display: none;
    }

    .subject summary::after {
      content: "+";
      color: var(--blue);
      font-size: 23px;
      font-weight: 500;
    }

    .subject[open] summary::after {
      content: "−";
    }

    .subject-name {
      font-weight: 700;
    }

    .subject-kind {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .grade {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--lime);
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
    }

    .comparison {
      min-width: 180px;
    }

    .comparison-bar {
      display: flex;
      height: 9px;
      margin-bottom: 7px;
      overflow: hidden;
      border-radius: 8px;
      background: #edf0f6;
    }

    .higher-bar {
      background: var(--orange);
    }

    .lower-bar {
      background: var(--lime);
    }

    .comparison-counts {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .comparison-counts b {
      color: var(--ink);
    }

    .subject-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 20px 20px;
      border-top: 1px solid var(--line);
    }

    .detail-box {
      margin-top: 16px;
      padding: 15px;
      border-radius: 14px;
      background: var(--paper-2);
    }

    .detail-box strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    .detail-box span {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 35px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      .hero,
      .setup {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 20px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .subject summary {
        grid-template-columns: 1fr auto 22px;
      }

      .comparison {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .subject-detail {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      .privacy {
        display: none;
      }

      h1 {
        font-size: 53px;
      }

      .setup {
        padding: 12px;
        border-radius: 21px;
      }

      .drop {
        min-height: 155px;
      }

      .metric-value {
        font-size: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        INTECH
        <small>Made by Intech</small>
      </div>
      <div class="privacy">Your spreadsheet is processed inside your browser.</div>
    </header>

    <section class="hero">
      <div>
        <h1>Understand your results <span class="highlight">better.</span></h1>
        <p>
          Compare your SPI, CPI, and subject-wise grades with your class
          without uploading your academic data anywhere.
        </p>
      </div>
    </section>

    <section class="setup" aria-label="Upload result sheet">
      <label class="drop" id="drop" tabindex="0">
        <input id="file" type="file" accept=".xlsx,.xls,.csv">
        <span class="upload-icon">↑</span>
        <strong id="dropTitle">Choose your Excel sheet</strong>
        <span id="dropSubtitle">or drag and drop it here</span>
      </label>

      <div class="controls">
        <label for="roll">Your roll number</label>
        <input id="roll" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter roll number">
        <button class="primary" id="analyze">Analyze results</button>
        <div class="loading" id="loading">
          <span class="spinner"></span>
          Reading your result sheet…
        </div>
      </div>
    </section>

    <p class="message" id="message" role="alert"></p>
    <div id="output"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const $ = selector => document.querySelector(selector);

    const escapeHTML = value =>
      String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));

    const normalize = value =>
      String(value ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");

    let students = [];
    let subjects = [];

    const gradeOrder = ["F", "D", "C", "B", "B+", "A", "A+", "O"];

    function gradeValue(grade) {
      const index = gradeOrder.indexOf(String(grade || "").trim().toUpperCase());
      return index === -1 ? null : index;
    }

    function showMessage(message) {
      $("#message").textContent = message;
    }

    function setLoading(active) {
      $("#loading").classList.toggle("show", active);
      $("#analyze").disabled = active;
    }

    function loadWorkbook(file) {
      setLoading(true);
      showMessage("");

      const reader = new FileReader();

      reader.onerror = () => {
        setLoading(false);
        showMessage("Could not read this file. Please try another Excel file.");
      };

      reader.onload = event => {
        try {
          const workbook = XLSX.read(event.target.result, { type: "array" });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const data = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

          if (!data.length) {
            throw new Error("empty");
          }

          const columns = Object.keys(data[0]);
          const findColumn = expected =>
            columns.find(column => normalize(column) === expected);

          const nameColumn = findColumn("name");
          const rollColumn = findColumn("rollno");
          const spiColumn = findColumn("spi");
          const cpiColumn = findColumn("cpi");

          if (!rollColumn || !spiColumn || !cpiColumn) {
            throw new Error("columns");
          }

          subjects = columns.filter(column =>
            ![nameColumn, rollColumn, spiColumn, cpiColumn].includes(column) &&
            String(column).trim()
          );

          students = data
            .map(row => ({
              name: String(nameColumn ? row[nameColumn] : "").trim(),
              roll: String(row[rollColumn]).trim(),
              spi: Number.parseFloat(row[spiColumn]),
              cpi: Number.parseFloat(row[cpiColumn]),
              grades: Object.fromEntries(
                subjects.map(subject => [
                  subject,
                  String(row[subject] ?? "").trim().toUpperCase()
                ])
              )
            }))
            .filter(student =>
              student.roll &&
              Number.isFinite(student.spi) &&
              Number.isFinite(student.cpi)
            );

          if (!students.length) {
            throw new Error("students");
          }

          $("#dropTitle").textContent = file.name;
          $("#dropSubtitle").textContent =
            `${students.length} students loaded successfully`;
          showMessage("");
        } catch (error) {
          students = [];
          subjects = [];

          const messages = {
            empty: "This spreadsheet is empty.",
            columns: "Required columns not found. The sheet needs Roll No, SPI, and CPI columns.",
            students: "No valid students were found in this sheet."
          };

          showError(messages[error.message] || "This file could not be processed.");
        }

        setLoading(false);
      };

      reader.readAsArrayBuffer(file);
    }

    function showError(message) {
      $("#output").innerHTML = `
        <div class="error-card">
          <div class="emoji">📄</div>
          <strong>We could not analyze this sheet</strong>
          <span>${escapeHTML(message)}</span>
        </div>
      `;
      showMessage("");
    }

    function getStudentStats(key, student) {
      const higher = students.filter(other => other[key] > student[key]).length;
      const lower = students.filter(other => other[key] < student[key]).length;
      const tied = students.filter(other =>
        other !== student && other[key] === student[key]
      ).length;

      const average =
        students.reduce((sum, other) => sum + other[key], 0) / students.length;

      return {
        higher,
        lower,
        tied,
        rank: higher + 1,
        average,
        highest: Math.max(...students.map(other => other[key]))
      };
    }

    function metricCard(title, value, stats) {
      return `
        <article class="metric">
          <div class="metric-title">Your ${title}</div>
          <div class="metric-value">${value.toFixed(2)}</div>
          <div class="metric-info">
            Rank <b>${stats.rank}</b> of ${students.length}<br>
            ${stats.higher} students scored higher<br>
            ${stats.lower} students scored lower<br>
            Class average <b>${stats.average.toFixed(2)}</b>
          </div>
        </article>
      `;
    }

    function subjectComparison(student, subject) {
      const ownGrade = gradeValue(student.grades[subject]);

      if (ownGrade === null) {
        return null;
      }

      const validStudents = students.filter(other =>
        gradeValue(other.grades[subject]) !== null
      );

      const higher = validStudents.filter(other =>
        gradeValue(other.grades[subject]) > ownGrade
      ).length;

      const lower = validStudents.filter(other =>
        gradeValue(other.grades[subject]) < ownGrade
      ).length;

      const total = higher + lower;
      const higherWidth = total ? (higher / total) * 100 : 0;
      const lowerWidth = total ? (lower / total) * 100 : 0;
      const isLab = /lab/i.test(subject);

      return {
        name: subject.replace(/\s*\([^)]*\)\s*$/, ""),
        grade: student.grades[subject],
        higher,
        lower,
        higherWidth,
        lowerWidth,
        isLab
      };
    }

    function subjectRow(subject) {
      const valid = subjectComparison(currentStudent, subject);
      if (!valid) return "";

      return `
        <details class="subject">
          <summary>
            <div class="subject-name">
              ${escapeHTML(valid.name)}
              <span class="subject-kind">
                ${valid.isLab ? "Laboratory" : "Theory"}
              </span>
            </div>

            <div class="comparison">
              <div class="comparison-bar">
                <i class="higher-bar" style="width:${valid.higherWidth}%"></i>
                <i class="lower-bar" style="width:${valid.lowerWidth}%"></i>
              </div>
              <div class="comparison-counts">
                <span><b>${valid.higher}</b> higher</span>
                <span><b>${valid.lower}</b> lower</span>
              </div>
            </div>

            <span class="grade">${escapeHTML(valid.grade)}</span>
          </summary>

          <div class="subject-detail">
            <div class="detail-box">
              <strong>Students scoring higher</strong>
              <span>${valid.higher} students were excluded from the lower count.</span>
            </div>
            <div class="detail-box">
              <strong>Students scoring lower</strong>
              <span>${valid.lower} students were excluded from the higher count.</span>
            </div>
          </div>
        </details>
      `;
    }

    function subjectSection() {
      const theory = subjects.filter(subject => !/lab/i.test(subject));
      const labs = subjects.filter(subject => /lab/i.test(subject));

      const renderGroup = (title, list) => {
        const rows = list.map(subjectRow).join("");

        if (!rows) return "";

        return `
          <div class="subject-group">
            <div class="group-title">${title}</div>
            ${rows}
          </div>
        `;
      };

      return `
        <section class="section">
          <div class="section-heading">
            <div>
              <h2>Subject comparison</h2>
              <p>
                Expand a subject to see how many valid students scored higher
                or lower than you.
              </p>
            </div>
          </div>

          ${renderGroup("Theory", theory)}
          ${renderGroup("Labs", labs)}
        </section>
      `;
    }

    let currentStudent = null;

    function analyze() {
      if (!students.length) {
        showMessage("Choose an Excel sheet first.");
        return;
      }

      const roll = $("#roll").value.trim();

      if (!roll) {
        showMessage("Enter your roll number.");
        return;
      }

      currentStudent = students.find(student => student.roll === roll);

      if (!currentStudent) {
        showMessage(`Roll number ${roll} was not found in this sheet.`);
        return;
      }

      const spiStats = getStudentStats("spi", currentStudent);
      const cpiStats = getStudentStats("cpi", currentStudent);

      $("#output").innerHTML = `
        <section class="results">
          <div class="intro">
            <h2>Here is your class snapshot.</h2>
            <p>
              ${escapeHTML(currentStudent.name || "Student")},
              roll number ${escapeHTML(currentStudent.roll)}.
            </p>
          </div>

          <div class="metric-grid">
            ${metricCard("SPI", currentStudent.spi, spiStats)}
            ${metricCard("CPI", currentStudent.cpi, cpiStats)}
          </div>

          ${subjectSection()}
        </section>
      `;

      $("#output").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    const drop = $("#drop");

    $("#file").addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) loadWorkbook(file);
    });

    drop.addEventListener("dragover", event => {
      event.preventDefault();
      drop.classList.add("active");
    });

    drop.addEventListener("dragleave", () => {
      drop.classList.remove("active");
    });

    drop.addEventListener("drop", event => {
      event.preventDefault();
      drop.classList.remove("active");

      const file = event.dataTransfer.files[0];
      if (file) loadWorkbook(file);
    });

    drop.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        $("#file").click();
      }
    });

    $("#analyze").addEventListener("click", analyze);

    $("#roll").addEventListener("keydown", event => {
      if (event.key === "Enter") analyze();
    });
  </script>
